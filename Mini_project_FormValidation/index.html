<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div class="container-fluid p-0 text-center">
        <h2 style="color: rgb(14, 101, 32);">Registration Form</h2>

        <div class="box mt-5 p-5">
            <form id="registrationForm">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <label for="text" class="label">Name</label>
                    <input id="text" type="text" class="form-control" placeholder="Enter Your Name...">
                </div>
                <p id="nameError"></p>

                <div class="d-flex align-items-center gap-3 mb-3">
                    <label for="email" class="label">Email</label>
                    <input id="email" type="email" class="form-control" placeholder="Enter Your Email...">
                </div>
                <p id="emailError"></p>

                <div class="d-flex align-items-center gap-3 mb-3">
                    <label for="number" class="label">Mobile</label>
                    <input type="number" id="number" class="form-control" placeholder="Enter Mobile Number">
                </div>
                <p id="phoneError"></p>

                <div class="d-flex align-items-center gap-3 mb-3">
                    <label for="pass" class="label">Password</label>
                    <input id="pass" type="password" class="form-control" placeholder="Enter Password">
                </div>
                <p id="passwordError"></p>


                <br><br>
                <button type="submit" id="button" class="button">Register</button>
                <p id="result"></p>

            </form>
        </div>

    </div>


    <script src="./app.js"></script>
</body>

</html>
